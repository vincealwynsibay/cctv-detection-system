services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    # /dev/shm size for parallel queries / hash aggregates. Docker's 64 MB
    # default is too small for the SSE aggregation rollup; without this the
    # query fails with `could not resize shared memory segment ... No space
    # left on device`.
    shm_size: '1gb'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic
    command: >
      postgres
      -c password_encryption=md5
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: traffic
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-10}
      AUTH_TYPE: md5
    ports:
      - "5432:5432"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@pgbouncer:5432/traffic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPLOAD_DIR: /app/uploads
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      TZ: ${TZ:-Asia/Manila}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      SUPER_KEY: ${SUPER_KEY:-}
      FERNET_KEY: ${FERNET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Seconds to buffer each live-view frame before sending it over the WS,
      # so the worker's detection for that frame has time to land in Redis.
      # Higher = better box-frame sync, more video latency. Lower = snappier
      # video, boxes will trail. Tune for your worker batch latency.
      OVERLAY_DELAY_SEC: ${OVERLAY_DELAY_SEC:-0.2}
      # Live-preview frame rate per camera over the WS. Lower = less server
      # CPU spent on RTSP decode + JPEG encode, at the cost of choppier video.
      # 10 FPS is the sweet spot for a Mac/CPU dev stack with 4 cameras.
      LIVE_PREVIEW_FPS: ${LIVE_PREVIEW_FPS:-10}
      # When 1, server skips its own RTSP capture and relays the worker's
      # annotated JPEG frames from Redis. Must match the worker's flag.
      WORKER_PUBLISHES_FRAMES: ${WORKER_PUBLISHES_FRAMES:-0}
      # 0 = disabled (default). Set to e.g. 60 in production to run warrant
      # analysis automatically every hour. Dev stacks should leave this at 0
      # to avoid background writes clobbering manually-set test data.
      ANALYSIS_INTERVAL_MINUTES: ${ANALYSIS_INTERVAL_MINUTES:-0}
      # Path to the temporal warrant CNN checkpoint inside the container.
      # Defaults to the synthetic baseline (server/ml/temporal_cnn_model.pt).
      # Set to the real-trained Toronto checkpoint to flip the badge to
      # "Real-trained CNN" and use the post-sprint model in production.
      TEMPORAL_CNN_MODEL_PATH: ${TEMPORAL_CNN_MODEL_PATH:-/app/runs/real_cnn/real_cnn_seed0.pt}
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads
      - ./server:/app/server
      - ./common:/app/common
      # runs/ carries trained checkpoints (real_cnn, temporal_cnn) plus the
      # stochastic microsim output. Mounting it read-only is sufficient for
      # serving inference, and avoids any accidental writes from the API.
      - ./runs:/app/runs:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  rq-worker:
    build:
      context: .
      dockerfile: ${RQ_WORKER_DOCKERFILE:-rq-worker/Dockerfile}
    container_name: rq-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/traffic
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      UPLOAD_DIR: /app/uploads
      MODEL_VERSION: ${MODEL_VERSION:-eyegila_v4}
      # Canonical in-container path for the mounted model weights file.
      # video_job.py reads this via os.getenv("MODEL_PATH", "/app/model.pt").
      MODEL_PATH: /app/model.pt
    volumes:
      - upload_data:/app/uploads
      - ./rq-worker:/app/rq-worker
      - ./common:/app/common
      - ./worker:/app/worker
      - ./${MODEL_VERSION:-eyegila_v4}.pt:/app/model.pt:ro
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy

  # --- profiles: worker (mac/cpu dev) ---

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: worker/Dockerfile.mac
    container_name: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/traffic
      REDIS_URL: redis://redis:6379
      CAMERAS_PER_WORKER: ${CAMERAS_PER_WORKER:-1}
      INFERENCE_EVERY_N: ${INFERENCE_EVERY_N:-1}
      READER_MAX_FPS: ${READER_MAX_FPS:-0}
      # When 1, worker publishes annotated JPEG frames to Redis so the server
      # WS can skip its own RTSP decode. Must match the server's flag.
      WORKER_PUBLISHES_FRAMES: ${WORKER_PUBLISHES_FRAMES:-0}
      WORKER_FRAME_JPEG_QUALITY: ${WORKER_FRAME_JPEG_QUALITY:-75}
      FERNET_KEY: ${FERNET_KEY:-}
      MODEL_VERSION: ${MODEL_VERSION:-eyegila_v4}
      # Canonical in-container path for the mounted model weights.
      MODEL_PATH: /app/model.pt
    volumes:
      - ./worker:/app/worker
      - ./common:/app/common
      - ./${MODEL_VERSION:-eyegila_v4}.pt:/app/model.pt:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- profiles: worker-gpu (production, NVIDIA) ---

  worker-gpu:
    profiles: [worker-gpu]
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker-gpu
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/traffic
      REDIS_URL: redis://redis:6379
      CAMERAS_PER_WORKER: ${CAMERAS_PER_WORKER:-16}
      INFERENCE_EVERY_N: ${INFERENCE_EVERY_N:-1}
      READER_MAX_FPS: ${READER_MAX_FPS:-0}
      TRT_CACHE_DIR: /app/trt_cache
      FERNET_KEY: ${FERNET_KEY:-}
      MODEL_VERSION: ${MODEL_VERSION:-eyegila_v4}
    volumes:
      - trt_cache:/app/trt_cache
      - ./worker:/app/worker
      - ./common:/app/common
      - ./${MODEL_VERSION:-eyegila_v4}.pt:/app/model.pt:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker-gpu-2:
    profiles: [worker-gpu]
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker-gpu-2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/traffic
      REDIS_URL: redis://redis:6379
      CAMERAS_PER_WORKER: ${CAMERAS_PER_WORKER:-16}
      INFERENCE_EVERY_N: ${INFERENCE_EVERY_N:-1}
      READER_MAX_FPS: ${READER_MAX_FPS:-0}
      TRT_CACHE_DIR: /app/trt_cache
      FERNET_KEY: ${FERNET_KEY:-}
      MODEL_VERSION: ${MODEL_VERSION:-eyegila_v4}
    volumes:
      - trt_cache:/app/trt_cache
      - ./worker:/app/worker
      - ./common:/app/common
      - ./${MODEL_VERSION:-eyegila_v4}.pt:/app/model.pt:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- profiles: frontend ---

  frontend:
    profiles: [frontend]
    build:
      context: ./eyegila
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  # --- profiles: monitoring ---

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - server
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/worker-health.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # --- profiles: tools ---

  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - timescaledb

  mediamtx:
    profiles: [tools]
    image: bluenviron/mediamtx
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"

  seeder:
    profiles: [tools]
    build:
      context: .
      dockerfile: seeder/Dockerfile
    container_name: seeder
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/traffic
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: "no"

networks:
  default:
    name: traffic_network

volumes:
  timescale_data:
  upload_data:
  trt_cache:
  prometheus_data:
  grafana_data: